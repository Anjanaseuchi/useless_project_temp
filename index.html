<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Charger Guilt</title>

  <!-- Pico CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
  >

  <!-- Our custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>


<body>

  <main class="container">

    <!-- ======================================
         TITLE
    ======================================= -->

    <h1>🔌 Charger Guilt</h1>

    <p id="tagline">
      Your phone is charging. Please leave it alone. 😭
    </p>


    <!-- ======================================
         BATTERY INFORMATION
    ======================================= -->

    <p id="batteryState">
      🔋 Checking battery...
    </p>


    <!-- ======================================
         CUTE ANIMAL
    ======================================= -->

    <div id="animalBox">

      <div id="animalFace">
        🐱
      </div>

      <p id="animalMessage">
        I'm watching you... 👀
      </p>

    </div>


    <!-- ======================================
         START CHARGING BUTTON
         
         Shown only below 100%
    ======================================= -->

    <button
      id="startBtn"
      class="hidden"
    >
      🔌 I Just Plugged In
    </button>


    <!-- ======================================
         FULLY CHARGED BUTTON
         
         Shown only at 100%
    ======================================= -->

    <button
      id="fullBtn"
      class="hidden"
    >
      🎉 Fully Charged
    </button>


    <!-- ======================================
         CHARGING STATUS
    ======================================= -->

    <div
      id="statusPanel"
      class="hidden"
    >

      <div class="status-title">
        ⚡ CHARGING
      </div>


      <p class="status-line">

        Battery:

        <strong id="batteryPercent">
          --%
        </strong>

      </p>


      <p class="status-line">

        Times you've been caught:

        <span id="count">
          0
        </span>

      </p>


      <!-- USER ACTIVITY -->

      <p id="useStatus">
        💤 Phone is resting...
      </p>

    </div>


    <!-- ======================================
         CELEBRATION
    ======================================= -->

    <div
      id="celebration"
      class="hidden"
    >

      <div class="celebration-emoji">
        🎉 🔋 🎉
      </div>

      <p id="celebrateText">
        Fully charged! Good job leaving it alone. 😇
      </p>

    </div>


    <!-- ======================================
         HISTORY
    ======================================= -->

    <p id="historyText"></p>

  </main>


  <!-- ========================================
       JAVASCRIPT
  ========================================= -->

  <script src="script.js"></script>

</body>

</html>
